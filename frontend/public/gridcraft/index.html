<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GridCraft</title>
  <link rel="icon" href="./gridcraft-45f84b7721cb79a9.ico" integrity="sha384-FzBCWcgv5VqBLEPSBvyC78gOs2HMh3hKu2LSLSXU01NgL5yKLk/nHdINuu0Ztky1"/>
  
<script type="module">
import init, * as bindings from './gridcraft-web-330b602dfda5724.js';
const wasm = await init({ module_or_path: './gridcraft-web-4519cacaa315f2bf_bg.wasm' });


window.wasmBindings = bindings;

// Forward Ctrl+S / Save commands from parent directly into canvas
window.addEventListener('message', (event) => {
  if (event.data?.type === 'gridcraft:trigger_save') {
    const canvas = document.getElementById('gridcraft_canvas');
    if (canvas) {
      const e = new KeyboardEvent('keydown', {
        key: 's',
        code: 'KeyS',
        keyCode: 83,
        which: 83,
        ctrlKey: true,
        metaKey: true,
        bubbles: true,
      });
      canvas.dispatchEvent(e);
      window.dispatchEvent(e);
    }
  }
});

dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f3f3f3; }
    #gridcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; contain: strict; will-change: transform; }
    #gridcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #555; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
<link rel="modulepreload" href="./gridcraft-web-330b602dfda5724.js" crossorigin="anonymous" integrity="sha384-GmeKAGpD0eMIcqF+P2f6Gvqs+b6mhh75uCrFz8jDceEyn3gZlEpeqgeYU/Ja1OUF"><link rel="preload" href="./gridcraft-web-4519cacaa315f2bf_bg.wasm" crossorigin="anonymous" integrity="sha384-HFk5+lN2wgvm5HF3o+78Xsyp6g9mvNf3tVFdXyXX+8y5LtkFA6s0pqKo/dYzTL6A" as="fetch" type="application/wasm"></head>
<body>
  <canvas id="gridcraft_canvas"></canvas>
  <div id="gridcraft_loading">Loading GridCraft&hellip;</div>
</body>
</html>
